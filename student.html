<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAT Smart Check — นักเรียน</title><link rel="stylesheet" href="student.css"></head><body><main><p class="tag">PAT SMART CHECK · นักเรียน</p><h1>ตารางฝึกงานของฉัน</h1><p id="status" role="status">กำลังตรวจการตั้งค่า…</p><button id="login" disabled>เข้าสู่ระบบด้วย LINE</button><section id="binding" hidden><h2>ขอผูกบัญชีนักเรียน</h2><p>กรอกรหัสนักเรียนแล้วรอครูตรวจสอบ บัญชีจะยังดูข้อมูลนักเรียนไม่ได้จนกว่าครูอนุมัติ</p><form id="bindingForm"><label for="studentCode">รหัสนักเรียน</label><input id="studentCode" required maxlength="40" autocomplete="off"><label for="centerId">รหัสศูนย์ เช่น PAT-C001</label><input id="centerId" required pattern="PAT-C0[0-2][0-9]" maxlength="8"><button id="requestBinding">ส่งคำขอให้ครูตรวจสอบ</button></form></section><section id="schedule" aria-live="polite"></section><p>การเช็กอินพิกัดยังไม่เปิดใช้งานในชุดเตรียมติดตั้งนี้</p><a href="index.html">กลับหน้าหลัก</a></main><script src="config.js"></script><script src="student-calendar.js"></script><script src="student.js"></script></body></html>
