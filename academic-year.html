<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปิดปีการศึกษาใหม่ · PAT Smart Check</title>
<link rel="stylesheet" href="students.css"><style>*{box-sizing:border-box}body{background:#f2f7f3;color:#193f31;font:16px system-ui;margin:0}main{max-width:860px;margin:auto;padding:22px}section{background:white;border:1px solid #dae7df;border-radius:16px;margin:16px 0;padding:20px}label{display:block;margin:10px 0}input,select,button{font:inherit;max-width:100%;padding:9px;border:1px solid #bbcec2;border-radius:8px}button{cursor:pointer;color:white;background:#176341;margin:4px}button:disabled{opacity:.5}#roster{max-height:320px;overflow:auto}#message{white-space:pre-line}li{margin:6px 0}a{color:#17523a}.date-guidance{display:flex;align-items:flex-start;gap:12px;padding:16px;margin:14px 0 22px;background:#edf6f0;border:1px solid #d7e9de;border-radius:14px;line-height:1.7}.date-guidance-icon{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:#fff;color:#19724d}.date-guidance-icon svg{width:24px;height:24px}.date-guidance strong{display:block;color:#18583e;font-size:15px}.date-guidance p{margin:4px 0 0;color:#526b5e;font-size:14px}@media(max-width:480px){main{padding:16px}section{padding:16px}.date-guidance{padding:12px;gap:10px}} 
#selection input[type="checkbox"]{appearance:auto;display:inline-block;width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;padding:0;margin:0;flex:0 0 18px;accent-color:#176341;vertical-align:middle}
.year-selection-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#eef6f1;border-radius:12px 12px 0 0}
.year-selection-bar label{display:flex;align-items:center;gap:10px;margin:0;min-height:44px;cursor:pointer}.year-selection-bar span{font-size:13px;color:#526b5e}
#roster{max-height:380px;overflow:auto;border:1px solid #dbe7df;border-radius:0 0 12px 12px}
#roster .year-roster{display:table;width:100%;border-collapse:collapse;table-layout:fixed;text-align:left}
#roster caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#roster thead{display:table-header-group}#roster tbody{display:table-row-group}
#roster tr{display:table-row;padding:0;border:0}
#roster th,#roster td{display:table-cell;padding:10px 12px;border-bottom:1px solid #e6eee9;vertical-align:middle;grid-column:auto;grid-row:auto;font-size:14px;overflow-wrap:anywhere}
#roster th{position:sticky;top:0;z-index:1;background:#f5f9f6;color:#305b44;font-weight:600}
#roster th:first-child{width:64px;text-align:center}#roster th:nth-child(2){width:34%}
#roster td:first-child{text-align:center;padding:0}#roster td[colspan]{padding:20px;color:#627568;text-align:center}
#roster tbody tr:nth-child(even){background:#fafcfb}#roster tbody tr:has(input:checked){background:#eaf5ee}
#roster .year-check-target{display:flex;align-items:center;justify-content:center;min-height:44px;margin:0;cursor:pointer}
#selection input:focus-visible{outline:3px solid #f2a344;outline-offset:3px}
@media(max-width:480px){#roster th,#roster td{padding:10px 8px;font-size:13px}#roster th:first-child{width:48px}}
</style>
<main><a href="students.html">← ทะเบียนนักเรียน</a><h1>เปิดปีการศึกษาใหม่</h1>
<label>ศูนย์การเรียน <select id="center"></select></label>
<section><h2>เตรียมห้องปีใหม่</h2><label>ปีการศึกษา (พ.ศ.) <input id="year" type="number"></label>
<p>คัดลอกระดับชั้นและกลุ่มจากปีก่อน เฉพาะห้องที่ยังไม่มีในปีที่เลือก</p><button id="rooms">ตรวจห้องที่จะสร้าง</button></section>
<section><h2>จัดรายชื่อเข้าห้อง</h2><label>รายการ <select id="mode"><option value="promote">เลื่อนชั้นนักเรียนเดิม</option><option value="new">นำเข้านักเรียนใหม่จาก Excel</option></select></label>
<label id="fromLabel">ห้องต้นทาง <select id="source"></select></label><label>ห้องปลายทาง <select id="target"></select></label>
<label>วันที่มีผล <input id="day" type="date"></label><aside class="date-guidance" aria-labelledby="dayHelpTitle"><span class="date-guidance-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5 3 3 5-5"/></svg></span><div><strong id="dayHelpTitle">วันที่มีผลในการเลื่อนชั้น</strong><p id="dayHelp"></p></div></aside>
<div id="selection"><div class="year-selection-bar"><label><input id="all" type="checkbox"> เลือกทุกคนในห้อง</label><span id="selectionCount" role="status">เลือก 0 คน</span></div><div id="roster" tabindex="0" role="region" aria-label="ตารางรายชื่อนักเรียน"></div></div>
<div id="upload" hidden><button id="download">ดาวน์โหลดเทมเพลต Excel</button><label>ไฟล์รายชื่อ .xlsx <input id="file" type="file" accept=".xlsx"></label></div>
<button id="preview">ตรวจรายชื่อ</button></section>
<section><h2>ผลการตรวจ</h2><p id="message" role="status">กำลังโหลดข้อมูล</p><ol id="result"></ol><button id="save" hidden>ยืนยันบันทึก</button><button id="discard" hidden>ปิดรายการเมื่อได้ตรวจผลแล้ว</button></section></main>
<script src="config.js"></script><script src="report-excel.js"></script><script src="excel-import.js?v=year1"></script><script src="academic-year.js?v=20261105table"></script></html>
