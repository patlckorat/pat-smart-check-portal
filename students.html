<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAT · ทะเบียนนักเรียน</title><link rel="icon" href="pat-icon.png"><link rel="stylesheet" href="students.css?v=20261026a"></head><body><header><div class="brand"><img src="pat-icon.png" alt="PAT"><div>PAT SMART CHECK<small>พื้นที่ครู · ทะเบียนนักเรียน</small></div></div><a href="teacher.html" class="btn">กลับพื้นที่ครู</a></header><main><div class="top"><div><h1>จัดการนักเรียน</h1><p id="identity" class="muted"></p></div><button id="add" class="btn primary" disabled>＋ เพิ่มนักเรียน</button></div><p id="notice" role="status" class="registry-hint">กำลังตรวจสิทธิ์…</p><p class="muted">รุ่นนี้เพิ่ม–แก้ไขทะเบียน ส่วนเปลี่ยนสถานะ ย้ายศูนย์ มอบหมายร้าน และรับรองชั่วโมงยังไม่เปิดในหน้านี้</p><section class="card" style="margin-top:20px"><form id="filters" class="filters"><label>ศูนย์<select id="center"></select></label><label>ห้องเรียน<select id="room"></select></label><label>สถานะ<select id="status"><option value="">ทุกสถานะ</option><option value="ACTIVE">ปกติ</option><option value="PAUSED">พัก (สถานะเดิม)</option><option value="COMPLETED">ฝึกจบ</option><option value="WITHDRAWN">ถอนตัว (สถานะเดิม)</option></select></label><label class="search">ชื่อหรือรหัสนักเรียน<input id="query" type="search" maxlength="100" placeholder="พิมพ์แล้วกดค้นหา"></label><button class="btn primary" id="search">ค้นหา / อัปเดต</button></form><div class="list-head"><strong id="count">—</strong><span class="muted">แสดงหน้าละ 25 คน</span></div><div class="table"><table><thead><tr><th>นักเรียน</th><th>ห้องเรียน</th><th>ร้านปัจจุบัน / LINE</th><th>สถานะ</th><th></th></tr></thead><tbody id="list"></tbody></table></div><div class="end"><button id="prev" class="btn" disabled>← ก่อนหน้า</button><span id="page"></span><button id="next" class="btn" disabled>ถัดไป →</button></div></section></main>
<dialog id="editor"><div class="row"><h2 id="title"></h2><button id="close" class="close" type="button" aria-label="ปิด">×</button></div><form id="form"><div class="grid"><label>ศูนย์<select id="editCenter" required></select></label><label>ห้องเรียน<select id="editClass" required></select></label><label>รหัสนักเรียน<input id="code" required maxlength="40"></label><label>รหัสพนักงาน (ถ้ามี)<input id="employee" maxlength="40"></label><label>คำนำหน้า<input id="prefix" maxlength="30"></label><label>ชื่อ<input id="first" required maxlength="80"></label><label>นามสกุล<input id="last" required maxlength="80"></label><label>เริ่มฝึก<input id="start" type="date" required></label><label>สิ้นสุดฝึก (ถ้ามี)<input id="end" type="date"></label></div><p id="protected" class="registry-hint"></p><details><summary>ประวัติแก้ไขทะเบียนล่าสุด</summary><div id="history"></div></details><p class="error" id="error" role="alert"></p><div class="footer"><button type="button" id="cancel" class="btn">ยกเลิก</button><button id="save" class="btn primary">บันทึกข้อมูล</button></div></form></dialog><script src="config.js"></script><script src="pat-loading.js"></script><script src="students.js?v=20261026a"></script></body></html>
